<div class="page-header">
    <h2>Payment Gateway Logs</h2>
    <p>View detailed transaction logs from Stripe and other connected gateways.</p>
</div>

<nz-card nzTitle="Transaction History" class="mt-6">
    <nz-table #txTable [nzData]="transactions" [nzLoading]="loading" [nzFrontPagination]="true" [nzPageSize]="10">
        <thead>
            <tr>
                <th>Date</th>
                <th>User ID</th>
                <th>Gateway</th>
                <th>Status</th>
                <th>Amount</th>
                <th>TX ID</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let tx of txTable.data">
                <td>{{ tx.createdAt | date:'medium' }}</td>
                <td><span class="text-xs text-slate-500 font-mono">{{ tx.userId }}</span></td>
                <td>
                    <nz-tag [nzColor]="getGatewayColor(tx.gateway)">{{ tx.gateway | uppercase }}</nz-tag>
                </td>
                <td>
                    <nz-badge [nzStatus]="getStatusColor(tx.status)" [nzText]="tx.status | uppercase"></nz-badge>
                </td>
                <td class="font-semibold">{{ (tx.amount / 100) | currency:tx.currency.toUpperCase() }}</td>
                <td><span class="text-xs text-slate-500 font-mono">{{ tx.gatewayTxId }}</span></td>
            </tr>
        </tbody>
    </nz-table>
</nz-card>
