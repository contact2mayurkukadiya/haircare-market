<div class="mb-6 flex items-center gap-4">
    <button nz-button type="button" nzType="default" nzShape="circle" (click)="cancel()" class="border-gray-200 w-10 h-10 flex items-center justify-center">
      <span nz-icon nzType="left"></span>
    </button>
    <div>
      <h2 class="text-2xl font-bold text-gray-800 m-0">{{ isEditMode ? 'Edit Category' : 'Create New Category' }}</h2>
      <p class="text-gray-500 text-sm m-0">{{ isEditMode ? 'Update the details for this category.' : 'Fill in the details to add a new category.' }}</p>
    </div>
  </div>
  
  <div class="bg-white rounded-xl border border-gray-100 p-6 md:p-8 max-w-2xl shadow-sm">
    <form nz-form [formGroup]="form" (ngSubmit)="submitForm()" nzLayout="vertical">
      
      <div class="space-y-4">
        <nz-form-item>
          <nz-form-label nzRequired nzFor="name" class="font-medium">Category Name</nz-form-label>
          <nz-form-control nzErrorTip="Please provide a category name">
            <input nz-input id="name" formControlName="name" placeholder="e.g. Shampoos" class="rounded-md h-10" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzFor="desc" class="font-medium">Description</nz-form-label>
          <nz-form-control>
            <textarea nz-input id="desc" formControlName="desc" placeholder="Describe the category..." [nzAutosize]="{ minRows: 4, maxRows: 8 }" class="rounded-md"></textarea>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label class="font-medium">Status</nz-form-label>
          <nz-form-control>
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-100 flex items-center justify-between">
              <div>
                <div class="text-sm font-medium text-gray-800">Active</div>
                <div class="text-xs text-gray-500">Enable or disable this category</div>
              </div>
              <nz-switch formControlName="isActive"></nz-switch>
            </div>
          </nz-form-control>
        </nz-form-item>
      </div>
  
      <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-gray-100">
        <button nz-button type="button" nzType="default" (click)="cancel()" class="h-10 px-6 rounded-md">Cancel</button>
        <button nz-button type="submit" nzType="primary" [nzLoading]="api.isLoading()" class="h-10 px-6 rounded-md bg-blue-600 hover:bg-blue-700 border-none font-medium">
          {{ isEditMode ? 'Update Category' : 'Create Category' }}
        </button>
      </div>
    </form>
  </div>
