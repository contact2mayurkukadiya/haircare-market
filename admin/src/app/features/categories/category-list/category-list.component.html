<div class="flex items-center justify-between mb-8">
    <div>
      <h2 class="text-2xl font-bold text-gray-800 m-0">Categories</h2>
      <p class="text-gray-500 text-sm m-0">Manage your product categories.</p>
    </div>
    <button nz-button nzType="primary" (click)="createCategory()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 border-none rounded-md px-4 h-10">
      <span nz-icon nzType="plus"></span> Add Category
    </button>
  </div>
  
  <nz-table #categoryTable [nzData]="categories()" [nzLoading]="api.isLoading()" [nzBordered]="false" [nzOuterBordered]="false" class="custom-table overflow-hidden rounded-xl border border-gray-100">
    <thead>
      <tr class="bg-gray-50">
        <th class="text-gray-600 font-semibold py-4">Name</th>
        <th class="text-gray-600 font-semibold py-4">Description</th>
        <th class="text-gray-600 font-semibold py-4">Status</th>
        <th class="text-gray-600 font-semibold py-4 text-right">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of categoryTable.data" class="hover:bg-blue-50/30 transition-colors group">
        <td class="py-4">
          <div class="flex items-center gap-3">
            <span class="font-medium text-gray-800">{{ data.name }}</span>
          </div>
        </td>
        <td class="py-4 text-gray-600">{{ data.desc || 'No description' }}</td>
        <td class="py-4">
          <nz-tag [nzColor]="data.isActive ? 'success' : 'error'" class="rounded-full px-3 py-0.5 border-none font-medium">
            {{ data.isActive ? 'Active' : 'Inactive' }}
          </nz-tag>
        </td>
        <td class="py-4 text-right">
          <div class="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
            <button nz-button nzType="text" nzTooltipTitle="Edit" nzTooltipPlacement="top" nz-tooltip (click)="editCategory(data)" class="text-blue-600 hover:bg-blue-50 rounded-full w-8 h-8 p-0 flex items-center justify-center">
              <span nz-icon nzType="edit"></span>
            </button>
            <button nz-button nzType="text" nzTooltipTitle="Delete" nzTooltipPlacement="top" nz-tooltip 
                nz-popconfirm nzPopconfirmTitle="Are you sure delete this category?" (nzOnConfirm)="deleteCategory(data._id)"
                class="text-red-500 hover:bg-red-50 rounded-full w-8 h-8 p-0 flex items-center justify-center">
              <span nz-icon nzType="delete"></span>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </nz-table>
