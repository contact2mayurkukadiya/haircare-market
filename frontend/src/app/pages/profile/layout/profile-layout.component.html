<div class="px-5 py-10 min-h-[80vh]">
    <div class="flex flex-col md:flex-row gap-8 items-start">

        <!-- SIDEBAR -->
        <div class="w-full md:w-64 bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden shrink-0">

            <!-- User Snippet (Optional but looks good in sidebar) -->
            <div class="p-5 border-b border-gray-100 flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center font-bold text-[#1a6b3c] overflow-hidden">
                    @if(auth.user()?.avatar) {
                    <img [src]="auth.user()!.avatar" class="w-full h-full object-cover">
                    } @else {
                    {{ auth.user()?.name?.[0]?.toUpperCase() }}
                    }
                </div>
                <div class="overflow-hidden">
                    <p class="font-bold text-sm truncate">{{ auth.user()?.name }}</p>
                    <p class="text-xs text-gray-500 truncate">{{ auth.user()?.email }}</p>
                </div>
            </div>

            <nav class="flex flex-col text-sm font-medium">
                <a routerLink="details" routerLinkActive="active-link" class="nav-item">
                    <span nz-icon nzType="user"></span> Personal Details
                </a>
                <a routerLink="security" routerLinkActive="active-link" class="nav-item">
                    <span nz-icon nzType="lock"></span> Login & Security
                </a>
                <a routerLink="orders" routerLinkActive="active-link" class="nav-item">
                    <span nz-icon nzType="shopping"></span> Your Orders
                </a>
            </nav>
        </div>

        <!-- CONTENT AREA -->
        <div class="flex-1 w-full bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 min-h-[500px]">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
