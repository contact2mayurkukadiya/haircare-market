<h2 class="text-2xl font-bold mb-2 text-gray-800">Login & Security</h2>
<p class="text-gray-500 mb-8 text-sm">Manage your password and security settings.</p>

<form [formGroup]="pwdForm" class="max-w-md space-y-6">
    <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1.5">Current Password</label>
        <input type="password" formControlName="current" placeholder="••••••••"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-gray-800 placeholder:text-gray-400 focus:outline-none focus:border-[#1a6b3c] focus:ring-4 focus:ring-[#1a6b3c]/10 transition-all">
    </div>

    <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1.5">New Password</label>
        <input type="password" formControlName="new" placeholder="Min 8 characters"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-gray-800 placeholder:text-gray-400 focus:outline-none focus:border-[#1a6b3c] focus:ring-4 focus:ring-[#1a6b3c]/10 transition-all">
    </div>

    <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1.5">Re-enter New Password</label>
        <input type="password" formControlName="confirm" placeholder="••••••••"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-gray-800 placeholder:text-gray-400 focus:outline-none focus:border-[#1a6b3c] focus:ring-4 focus:ring-[#1a6b3c]/10 transition-all">
    </div>

    <button type="button" class="btn-primary w-full justify-center mt-4 py-2.5 text-[0.95rem]"
        (click)="initPasswordReset()" [disabled]="pwdForm.invalid || isLoading()">
        @if (isLoading()) { Processing... } @else { Reset Password }
    </button>
</form>

<!-- OTP Modal -->
<nz-modal [nzVisible]="pwdStep() === 2" nzTitle="Verify OTP" (nzOnCancel)="pwdStep.set(1)" [nzFooter]="null"
    [nzCentered]="true">
    <ng-container *nzModalContent>
        <div class="text-center py-4">
            <div class="mb-4 text-4xl">🔐</div>
            <p class="text-gray-600 mb-6 font-medium">Please enter the 6-digit code sent to your email</p>

            <input
                class="w-full text-center text-3xl tracking-[0.5em] font-bold border border-gray-300 rounded-xl py-3 text-gray-800 
                          focus:outline-none focus:border-[#1a6b3c] focus:ring-4 focus:ring-[#1a6b3c]/10 transition-all mb-8 placeholder:text-gray-200"
                [(ngModel)]="otpValue" maxlength="6" placeholder="------">

            <button nz-button nzType="primary"
                class="w-full h-11 rounded-lg bg-[#1a6b3c] hover:bg-[#0d3d22] border-none font-bold"
                [nzLoading]="isLoading()" (click)="finalizePasswordReset()"
                [disabled]="!otpValue || otpValue.length < 6">
                Verify & Change Password
            </button>
        </div>
    </ng-container>
</nz-modal>
