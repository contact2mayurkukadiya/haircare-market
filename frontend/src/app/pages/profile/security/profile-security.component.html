<h2 class="text-2xl font-bold mb-2 text-gray-800">Login & Security</h2>
<p class="text-gray-500 mb-8 text-sm">Manage your password and security settings.</p>

<form [formGroup]="pwdForm" class="max-w-md space-y-6">
    <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1.5">Current Password</label>
        <div class="relative">
            <input [type]="showCurrentPassword() ? 'text' : 'password'" formControlName="current" placeholder="••••••••"
                class="w-full px-4 py-2.5 !pr-12 rounded-lg border border-gray-300 text-gray-800 placeholder:text-gray-400 focus:outline-none focus:border-[#1a6b3c] focus:ring-4 focus:ring-[#1a6b3c]/10 transition-all">
            <button type="button"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
                (click)="showCurrentPassword.set(!showCurrentPassword())">
                <span nz-icon [nzType]="showCurrentPassword() ? 'eye' : 'eye-invisible'" class="text-xl"></span>
            </button>
        </div>
    </div>

    <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1.5">New Password</label>
        <div class="relative">
            <input [type]="showNewPassword() ? 'text' : 'password'" formControlName="new" placeholder="Min 8 characters"
                class="w-full px-4 py-2.5 !pr-12 rounded-lg border border-gray-300 text-gray-800 placeholder:text-gray-400 focus:outline-none focus:border-[#1a6b3c] focus:ring-4 focus:ring-[#1a6b3c]/10 transition-all">
            <button type="button"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
                (click)="showNewPassword.set(!showNewPassword())">
                <span nz-icon [nzType]="showNewPassword() ? 'eye' : 'eye-invisible'" class="text-xl"></span>
            </button>
        </div>
    </div>

    <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1.5">Re-enter New Password</label>
        <div class="relative">
            <input [type]="showConfirmPassword() ? 'text' : 'password'" formControlName="confirm" placeholder="••••••••"
                class="w-full px-4 py-2.5 !pr-12 rounded-lg border border-gray-300 text-gray-800 placeholder:text-gray-400 focus:outline-none focus:border-[#1a6b3c] focus:ring-4 focus:ring-[#1a6b3c]/10 transition-all">
            <button type="button"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
                (click)="showConfirmPassword.set(!showConfirmPassword())">
                <span nz-icon [nzType]="showConfirmPassword() ? 'eye' : 'eye-invisible'" class="text-xl"></span>
            </button>
        </div>
    </div>

    <button type="button" class="btn-primary w-full justify-center mt-4 py-2.5 text-[0.95rem]"
        (click)="initPasswordReset()" [disabled]="pwdForm.invalid || isLoading()">
        @if (isLoading()) { Processing... } @else { Reset Password }
    </button>
</form>

<!-- Shared OTP Modal -->
<app-otp-verification [visible]="pwdStep() === 2" [isLoading]="isLoading()" [isResending]="isResending()"
    (otpSubmitted)="finalizePasswordReset($event)" (resendRequested)="resendOtp()" (modalClosed)="pwdStep.set(1)">
</app-otp-verification>
