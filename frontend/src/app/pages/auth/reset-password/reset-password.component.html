<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">🌿</div>
        <h2 class="auth-title">Reset Password</h2>
        <p class="auth-sub">Create a new secure password for your account.</p>

        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
            <div class="form-group">
                <label>New Password</label>
                <div class="relative">
                    <input [type]="showPassword() ? 'text' : 'password'" formControlName="new"
                        placeholder="Min 8 characters" class="form-input w-full !pr-12">
                    <button type="button"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
                        (click)="showPassword.set(!showPassword())">
                        <span nz-icon [nzType]="showPassword() ? 'eye' : 'eye-invisible'" class="text-xl"></span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <div class="relative">
                    <input [type]="showConfirmPassword() ? 'text' : 'password'" formControlName="confirm"
                        placeholder="••••••••" class="form-input w-full !pr-12">
                    <button type="button"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
                        (click)="showConfirmPassword.set(!showConfirmPassword())">
                        <span nz-icon [nzType]="showConfirmPassword() ? 'eye' : 'eye-invisible'" class="text-xl"></span>
                    </button>
                </div>
            </div>
            @if (resetForm.invalid && resetForm.touched) {
            <div class="form-error">Please verify your new passwords match and meet requirements.</div>
            }
            <button type="submit" [disabled]="resetForm.invalid" class="btn-primary submit-btn">
                Reset Password
            </button>
        </form>
    </div>
</div>

<!-- Shared OTP Modal -->
<app-otp-verification [visible]="showOtpModal()" [isLoading]="isLoading()" [isResending]="isResending()"
    (otpSubmitted)="finalizeReset($event)" (resendRequested)="resendOtp()" (modalClosed)="showOtpModal.set(false)">
</app-otp-verification>
