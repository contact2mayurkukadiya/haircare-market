<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">🌿</div>
    <h2 class="auth-title">Create Account</h2>
    <p class="auth-sub">Join HairCare Market today</p>
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="name" name="name" placeholder="Jane Doe" required class="form-input">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required class="form-input">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Min 8 characters" required class="form-input">
      </div>
      @if (error()) {
        <div class="form-error">{{ error() }}</div>
      }
      <button type="submit" class="btn-primary submit-btn" [disabled]="loading()">
        @if (loading()) { Creating account... } @else { Create Account }
      </button>
    </form>
    <p class="auth-footer">
      Already have an account? <a routerLink="/auth/login" class="auth-link">Sign In</a>
    </p>
  </div>
</div>
