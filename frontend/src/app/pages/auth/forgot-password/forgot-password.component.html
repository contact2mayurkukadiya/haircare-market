<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">🌿</div>
        <h2 class="auth-title">Forgot Password</h2>
        <p class="auth-sub">Enter your email address to receive a reset link.</p>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" formControlName="email" placeholder="you@example.com" class="form-input">
            </div>
            @if (forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched) {
            <div class="form-error">Please enter a valid email.</div>
            }

            <button type="submit" [disabled]="forgotForm.invalid || isLoading()" class="btn-primary submit-btn">
                @if (isLoading()) {
                <span nz-icon nzType="loading" class="mr-2"></span> Sending...
                } @else {
                Send Reset Link
                }
            </button>
        </form>

        <p class="auth-footer">
            Remembered your password?
            <a routerLink="/auth/login" class="auth-link">Back to log in</a>
        </p>
    </div>
</div>
