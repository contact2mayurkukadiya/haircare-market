<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">🌿</div>
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-sub">Sign in to your HairCare Market account</p>
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required class="form-input">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required class="form-input">
      </div>
      @if (error()) {
        <div class="form-error">{{ error() }}</div>
      }
      <button type="submit" class="btn-primary submit-btn" [disabled]="loading()">
        @if (loading()) { Signing in... } @else { Sign In }
      </button>
    </form>
    <p class="auth-footer">
      Don't have an account? <a routerLink="/auth/register" class="auth-link">Register</a>
    </p>
  </div>
</div>
